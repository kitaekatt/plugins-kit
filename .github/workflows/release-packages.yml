# Build and upload ONE package release to PyPI, from its release tag.
#
# scripts/publish.py creates the tag (<distribution>-v<version>, for example
# katsoft-llm-kit-v1.0.0) only after dev holds the tagged commit, then waits
# for this workflow's run titled "release <tag>" and verifies the uploaded
# wheel against a rebuild of the same tag before recording it in
# packages/released.json. A failed or missing run is resumed by the user
# (`gh run rerun <id>`, or `gh workflow run release-packages.yml --ref master
# -f tag=<tag>`); publish.py never re-dispatches. Procedure and states:
# docs/reference/package-release.md.
#
# This file must be identical on master and dev before any package releases
# (publish.py refuses otherwise): GitHub runs tag-push and dispatch workflows
# as defined on the default branch.
name: release-packages
run-name: release ${{ inputs.tag || github.ref_name }}

on:
  push:
    tags: ['*-v*']
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build and upload (<distribution>-v<version>)"
        required: true
        type: string

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_TAG_NAME: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Check out the release tag
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      # Asserts HEAD is the peeled tag and the pyproject version is the tag's
      # version, builds with packages/_build/release_build.py (B3: git archive
      # of the build inputs, pinned build constraints, SOURCE_DATE_EPOCH = the
      # commit time), and runs the wheel-content test.
      - name: Build the release wheel
        run: uv run --no-project --python 3.12 python packages/_build/release_build.py ci --repo . --tag "$RELEASE_TAG_NAME" --out dist

      - name: Upload to PyPI (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
