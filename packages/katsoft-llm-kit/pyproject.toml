[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "katsoft-llm-kit"
version = "1.5.0"
description = "LLM access, durable agent jobs and batch content pipelines in one library (import package llm_kit)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
# The base library is standard-library plus the contracts distribution. Each
# capability that needs a third-party package names it in an extra; the extras
# mirror plugins/llm-kit/pyproject.toml (tests/llm-kit/test_dist_metadata_parity.py).
dependencies = ["katsoft-contracts>=1.0,<2"]
# [project.urls] Source is set by the build hook from the release identity.
dynamic = ["urls"]

[project.scripts]
llm-kit = "llm_kit.cli:main"

[project.optional-dependencies]
config = ["pyyaml>=6.0"]
sdk = ["openai>=1.0.0"]
local = ["psutil>=6.0"]
frontdoor = ["fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27"]
jobs = ["pyyaml>=6.0"]
pipeline = ["pyyaml>=6.0"]

[tool.hatch.metadata.hooks.custom]
path = "../_build/hatch_build.py"

# The library source is src/llm_kit. The wheel selects it as a package and
# excludes the committed legacy marker src/llm_kit/_deployment.py; the build
# hook (packages/_build/hatch_build.py; registry `marker`) force-includes the
# release marker at that wheel path in its place.
[tool.hatch.build.targets.wheel]
packages = ["src/llm_kit"]
exclude = ["src/llm_kit/_deployment.py"]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "../_build/hatch_build.py"

# The sdist carries the source as committed, legacy marker included, and builds
# no wheel itself: a release wheel is built only by packages/_build/release_build.py.
[tool.hatch.build.targets.sdist]
include = ["src/llm_kit", "README.md", "LICENSE", "pyproject.toml"]
