[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "katsoft-contracts"
version = "1.0.0"
description = "Standard-library-only shared contracts of the plugins-kit marketplace: the execution-event envelope, the interrupt contract and the model declaration parser"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = []
# [project.urls] Source is set by the build hook from the release identity.
dynamic = ["urls"]

[tool.hatch.metadata.hooks.custom]
path = "../_build/hatch_build.py"

[tool.hatch.build.targets.wheel]
packages = ["src/katsoft_contracts"]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "../_build/hatch_build.py"
