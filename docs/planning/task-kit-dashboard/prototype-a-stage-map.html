<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Task dashboard - Prototype A</title>
<style>
:root {
  color-scheme: light dark;
  --bg:#f5f7fa; --panel:#ffffff; --panel2:#eef2f6; --text:#17202c; --muted:#5d6b7d; --line:#d9e0e8;
  --accent:#1769aa; --on-accent:#ffffff; --warn:#8f5c00; --bad:#b42318; --good:#147a43; --queue:#6b4fd1; --run:#1769aa;
  --shadow:0 6px 18px #0002;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg:#10151d; --panel:#18212d; --panel2:#1f2a39; --text:#e9eef5; --muted:#9eabba; --line:#334255;
    --accent:#71b7ff; --on-accent:#08111c; --warn:#f2b84b; --bad:#ff7b7b; --good:#83d6a3; --queue:#b79cff; --run:#71b7ff;
    --shadow:0 6px 18px #0007;
  }
}
* { box-sizing:border-box; }
html { -webkit-text-size-adjust:100%; }
body { margin:0; background:var(--bg); color:var(--text); font:14px/1.35 system-ui,-apple-system,"Segoe UI",sans-serif; }
button, input, select, textarea { font:inherit; color:inherit; }
h1,h2,h3,h4,p { margin:0; }
.mono { font-family:ui-monospace,"Cascadia Mono",Consolas,monospace; }
.muted { color:var(--muted); }
.grow { flex:1; }
.ic { width:16px; height:16px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; flex:none; }
.ic.fill { fill:currentColor; stroke:none; }

/* ---------- header ---------- */
.top { max-width:1520px; margin:0 auto; padding:10px 16px 0; }
.top-row { display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:8px; }
.top h1 { font-size:1.25em; }
.proto { font-size:12px; border:1px dashed var(--accent); color:var(--accent); border-radius:99px; padding:1px 9px; }
.status { color:var(--muted); font-size:13px; }
.status b { color:var(--text); font-weight:650; }
.chips { display:flex; gap:6px; flex-wrap:wrap; }
.fchip { border:1px solid var(--line); background:var(--panel); border-radius:99px; padding:3px 11px; cursor:pointer; font-size:13px; }
.fchip:hover { border-color:var(--accent); }
.fchip[aria-pressed=true] { background:var(--accent); border-color:var(--accent); color:var(--on-accent); }
.fchip .n { opacity:.75; margin-left:4px; font-size:12px; }
.fchip.needs[aria-pressed=false] { color:var(--warn); border-color:color-mix(in srgb,var(--warn) 55%,var(--line)); }
.search { border:1px solid var(--line); background:var(--panel); border-radius:6px; padding:4px 9px; width:190px; }
.search:focus-visible { outline:2px solid var(--accent); outline-offset:1px; }

.btn { display:inline-flex; align-items:center; gap:6px; border:1px solid var(--line); background:var(--panel2); border-radius:6px; padding:5px 11px; cursor:pointer; font-size:13px; line-height:1.2; white-space:nowrap; }
.btn:hover { border-color:var(--accent); }
.btn:focus-visible, .bubble:focus-visible, .pill:focus-visible, .task-id-copy:focus-visible, .fchip:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
.btn.primary { background:var(--accent); border-color:var(--accent); color:var(--on-accent); font-weight:600; }
.btn.danger { color:var(--bad); border-color:color-mix(in srgb,var(--bad) 55%,var(--line)); }
.btn.warn { background:color-mix(in srgb,var(--warn) 18%,var(--panel)); border-color:var(--warn); color:var(--text); font-weight:600; }
.btn.sm { padding:2px 8px; font-size:12px; }
.btn[disabled] { opacity:.5; cursor:not-allowed; }

/* ---------- layout ---------- */
.layout { max-width:1520px; margin:0 auto; padding:4px 16px 64px; display:grid; grid-template-columns:minmax(0,1fr) 410px; gap:18px; align-items:start; }
.panel { position:sticky; top:10px; max-height:calc(100vh - 20px); overflow:auto; background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:14px; }
.sec-title { display:flex; align-items:center; gap:8px; font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin:12px 0 5px; font-weight:650; }
.sec-title .count { text-transform:none; letter-spacing:0; font-weight:400; }
.sec-title:first-child { margin-top:2px; }
.count { font-size:.85em; color:var(--muted); font-weight:400; }

/* ---------- now running ---------- */
.run-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(270px,1fr)); gap:10px; align-items:start; }
.run-card { background:var(--panel); border:1px solid var(--line); border-left:4px solid var(--run); border-radius:8px; padding:10px 12px; display:flex; flex-direction:column; gap:6px; min-width:0; }
.run-card.idle { border-left-color:var(--line); border-style:dashed; color:var(--muted); justify-content:center; }
.run-card .proj { font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); display:flex; justify-content:space-between; gap:6px; }
.run-card .ttl { font-weight:650; font-size:15px; overflow-wrap:anywhere; }
.run-card .sub { font-size:12px; color:var(--muted); overflow-wrap:anywhere; }
.run-card .row { display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
.bar { height:5px; background:color-mix(in srgb,var(--run) 18%,var(--line)); border-radius:99px; overflow:hidden; }
.bar > i { display:block; height:100%; background:var(--run); border-radius:99px; transition:width .4s; }
.tail { margin:0; font:12px/1.4 ui-monospace,"Cascadia Mono",Consolas,monospace; color:var(--muted); background:var(--panel2); border-radius:5px; padding:6px 8px; white-space:pre-wrap; overflow-wrap:anywhere; max-height:7.6em; overflow:auto; }
.tail .err { color:var(--bad); }
.panel .tail { max-height:13em; }
.elapsed { font-variant-numeric:tabular-nums; font-weight:650; }
.live { display:inline-flex; align-items:center; gap:5px; color:var(--run); font-size:12px; font-weight:650; }
.live::before { content:''; width:7px; height:7px; border-radius:50%; background:var(--run); animation:blink 1.4s infinite; }
@keyframes blink { 50% { opacity:.25; } }

/* ---------- needs you ---------- */
.need-list { border:1px solid color-mix(in srgb,var(--warn) 45%,var(--line)); border-radius:8px; background:var(--panel); overflow:hidden; }
.need-row { display:grid; grid-template-columns:minmax(130px,auto) minmax(150px,1fr) minmax(0,2fr) auto; gap:4px 12px; align-items:center; padding:6px 10px; border-top:1px solid var(--line); border-left:4px solid var(--warn); }
.need-row:first-child { border-top:0; }
.need-row.failed { border-left-color:var(--bad); }
.need-row .kind { font-size:11px; text-transform:uppercase; letter-spacing:.05em; font-weight:700; color:var(--warn); display:flex; gap:5px; align-items:center; white-space:nowrap; }
.need-row.failed .kind { color:var(--bad); }
.need-row .ttl { font-weight:650; min-width:0; overflow-wrap:anywhere; }
.need-row .ttl small { display:block; font:11px ui-monospace,Consolas,monospace; color:var(--muted); font-weight:400; }
.need-row .why { font-size:12.5px; color:var(--muted); display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; min-width:0; }
.need-row .acts { display:flex; gap:6px; margin:0; flex-wrap:wrap; justify-content:flex-end; }
@media (max-width:760px) { .need-row { grid-template-columns:1fr; } .need-row .acts { justify-content:flex-start; } }

/* ---------- projects & stage maps ---------- */
.project-card { background:var(--panel); border:1px solid var(--line); border-radius:8px; margin:8px 0; }
.project-card[open] { border-color:color-mix(in srgb,var(--accent) 55%,var(--line)); }
.project-row { cursor:pointer; list-style:none; display:flex; align-items:center; gap:10px; padding:7px 12px; flex-wrap:wrap; }
.project-row::-webkit-details-marker { display:none; }
.project-row::before { content:''; width:7px; height:7px; border-right:2px solid var(--muted); border-bottom:2px solid var(--muted); transform:rotate(-45deg); transition:transform .15s; }
.project-card[open] > .project-row::before { transform:rotate(45deg); }
.project-title { font-weight:700; font-size:15px; }
.project-root { color:var(--muted); font:12px ui-monospace,Consolas,monospace; overflow-wrap:anywhere; }
.pstat { display:flex; gap:6px; flex-wrap:wrap; margin-left:auto; }
.project-body { border-top:1px solid var(--line); padding:4px 12px 10px; }
.sub-sec { margin-top:6px; }
.sub-sec > summary { cursor:pointer; list-style:none; display:flex; gap:6px; align-items:center; font-weight:650; border-bottom:1px solid var(--line); padding:4px 0 3px; }
.sub-sec > summary::-webkit-details-marker { display:none; }
.sub-sec > summary .count { font-weight:400; }
.sub-sec > summary::before { content:'+'; color:var(--muted); width:10px; }
.sub-sec[open] > summary::before { content:'-'; }
.sub-head { display:flex; gap:6px; align-items:center; font-weight:650; border-bottom:1px solid var(--line); padding:4px 0 3px; }

.task-card { border:1px solid var(--line); border-radius:7px; background:color-mix(in srgb,var(--panel) 80%,var(--bg)); margin:7px 0; padding:7px 10px 6px; }
.task-card.deferred { border-style:dashed; }
.task-head { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.task-meta { opacity:var(--age,1); display:flex; align-items:center; gap:8px; flex-wrap:wrap; min-width:0; }
.task-name-wrap { position:relative; min-width:0; }
.task-title { font-weight:650; cursor:help; }
.task-title:focus-visible { outline:1px solid var(--accent); outline-offset:2px; }
.summary-card { display:none; position:absolute; z-index:6; top:calc(100% + 5px); left:0; width:min(420px,calc(100vw - 40px)); padding:9px 11px; border:1px solid var(--accent); border-radius:6px; background:var(--panel); box-shadow:var(--shadow); white-space:normal; font-size:13px; font-weight:400; }
.task-name-wrap:hover .summary-card, .task-title:focus + .summary-card { display:block; }
.task-id-copy { appearance:none; border:0; background:transparent; color:var(--muted); font:12px ui-monospace,Consolas,monospace; padding:0; cursor:pointer; }
.task-id-copy:hover { color:var(--accent); text-decoration:underline; }
.pri { font-size:11px; font-weight:700; padding:0 6px; border-radius:4px; border:1px solid var(--line); color:var(--muted); }
.pri.P1 { color:var(--bad); border-color:color-mix(in srgb,var(--bad) 50%,var(--line)); }
.pri.P2 { color:var(--warn); border-color:color-mix(in srgb,var(--warn) 50%,var(--line)); }
.mini { width:56px; height:4px; background:var(--line); border-radius:99px; overflow:hidden; }
.mini > i { display:block; height:100%; background:var(--good); }
.task-acts { margin-left:auto; display:flex; gap:6px; }

.pipeline { display:flex; overflow-x:auto; padding:8px 2px 4px; scrollbar-width:thin; }
.node { position:relative; width:104px; flex:none; display:flex; flex-direction:column; align-items:center; gap:4px; --c:var(--muted); }
.node + .node::before { content:''; position:absolute; left:-33px; width:66px; top:18px; border-top:2px dashed var(--line); }
.node.edge-done::before { border-top:2px solid color-mix(in srgb,var(--good) 70%,var(--line)); }
.bubble { position:relative; width:38px; height:38px; border-radius:50%; border:2px solid var(--c); background:color-mix(in srgb,var(--c) 14%,var(--panel)); color:var(--c); display:grid; place-items:center; cursor:pointer; padding:0; transition:transform .12s; z-index:1; }
.bubble:hover { transform:scale(1.08); }
.bubble .ic { width:18px; height:18px; position:relative; }
.bubble .qn { font-weight:700; font-size:13px; position:relative; }
.node.sel .bubble { outline:2px solid var(--accent); outline-offset:3px; }
.nlabel { font-size:12px; text-align:center; line-height:1.25; width:100%; padding:0 3px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; min-height:30px; overflow-wrap:anywhere; }
.nsub { font-size:11px; color:var(--muted); min-height:20px; display:flex; align-items:center; gap:4px; }
.pill { border:1px solid var(--line); background:var(--panel); border-radius:99px; padding:0 9px; font-size:11px; line-height:18px; cursor:pointer; color:var(--text); }
.pill:hover { border-color:var(--accent); color:var(--accent); }
.pill.bad { color:var(--bad); border-color:color-mix(in srgb,var(--bad) 55%,var(--line)); }

.st-available .bubble { --c:var(--accent); border-color:color-mix(in srgb,var(--accent) 50%,var(--line)); background:var(--panel); color:var(--muted); }
.st-available .bubble:hover { color:var(--accent); border-color:var(--accent); }
.st-queued { --c:var(--queue); } .st-queued .bubble { border-style:dashed; }
.st-running { --c:var(--run); }
.st-running .bubble { border-color:transparent; background:conic-gradient(var(--run) calc(var(--p,0) * 1%), color-mix(in srgb,var(--run) 22%,var(--line)) 0); animation:pulse 2s infinite; }
.st-running .bubble::before { content:''; position:absolute; inset:3px; border-radius:50%; background:var(--panel); }
.st-blocked { --c:var(--warn); }
.st-failed { --c:var(--bad); }
.st-deferred { --c:var(--muted); } .st-deferred .bubble { border-style:dashed; opacity:.65; }
.st-done { --c:var(--good); } .st-done .bubble { background:var(--good); color:var(--panel); border-color:var(--good); }
.st-done .nlabel, .st-done .nsub { opacity:.7; }
.addnode .bubble { border-style:dashed; color:var(--muted); background:transparent; --c:var(--muted); }
.addnode .bubble:hover { color:var(--accent); border-color:var(--accent); }
@keyframes pulse { 0% { box-shadow:0 0 0 0 color-mix(in srgb,var(--run) 45%,transparent); } 100% { box-shadow:0 0 0 9px transparent; } }
@media (prefers-reduced-motion: reduce) { .st-running .bubble, .live::before { animation:none; } .bubble, .bar > i { transition:none; } }

.closed-row { display:flex; align-items:center; gap:10px; flex-wrap:wrap; border:1px solid var(--line); border-radius:7px; padding:5px 10px; margin:5px 0; opacity:var(--age,1); }
.empty { color:var(--muted); padding:8px 2px; }

/* ---------- history ---------- */
.runs-table { width:100%; border-collapse:collapse; font-size:13px; background:var(--panel); border:1px solid var(--line); border-radius:8px; overflow:hidden; }
.runs-table th { text-align:left; font-weight:600; color:var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:.05em; padding:5px 10px; background:var(--panel2); }
.runs-table td { padding:5px 10px; border-top:1px solid var(--line); vertical-align:top; }
.runs-table tr.click { cursor:pointer; } .runs-table tr.click:hover td { background:var(--panel2); }
.out { font-size:11px; font-weight:700; padding:1px 8px; border-radius:99px; border:1px solid currentColor; white-space:nowrap; }
.out.done { color:var(--good); } .out.failed { color:var(--bad); } .out.blocked { color:var(--warn); } .out.cancelled { color:var(--muted); }

/* ---------- side panel ---------- */
.p-head { display:flex; align-items:flex-start; gap:8px; }
.p-head .crumbs { font-size:12px; color:var(--muted); display:flex; gap:6px; align-items:center; flex-wrap:wrap; }
.panel h2 { font-size:1.15em; margin:6px 0 6px; overflow-wrap:anywhere; }
.badges { display:flex; gap:6px; flex-wrap:wrap; align-items:center; margin-bottom:8px; }
.badge { font-size:12px; font-weight:650; padding:2px 10px; border-radius:99px; border:1px solid var(--c,var(--line)); color:var(--c,var(--text)); background:color-mix(in srgb,var(--c,var(--panel)) 12%,var(--panel)); }
.chip { font-size:11px; padding:1px 8px; border-radius:99px; border:1px solid var(--line); color:var(--muted); white-space:nowrap; display:inline-flex; gap:5px; align-items:center; }
.chip .dot { width:7px; height:7px; border-radius:50%; background:var(--muted); }
.chip.claude .dot { background:#d9835b; } .chip.codex .dot { background:#4fa88f; }
.callout { border:1px solid var(--c); background:color-mix(in srgb,var(--c) 10%,var(--panel)); border-radius:7px; padding:9px 11px; margin:8px 0; --c:var(--warn); }
.callout.bad { --c:var(--bad); } .callout.info { --c:var(--accent); } .callout.good { --c:var(--good); }
.callout strong { display:block; margin-bottom:2px; }
.callout p { font-size:13px; overflow-wrap:anywhere; }
.acts { display:flex; gap:6px; flex-wrap:wrap; margin:10px 0; }
.card { background:var(--panel2); border:1px solid var(--line); border-radius:7px; padding:8px 10px; }
.kv { display:grid; grid-template-columns:90px 1fr; gap:4px 8px; align-items:center; font-size:13px; }
.kv dt { color:var(--muted); } .kv dd { margin:0; display:flex; gap:6px; align-items:center; flex-wrap:wrap; }
.seg { display:inline-flex; border:1px solid var(--line); border-radius:6px; overflow:hidden; }
.seg button { border:0; background:var(--panel); padding:3px 11px; cursor:pointer; font-size:13px; }
.seg button + button { border-left:1px solid var(--line); }
.seg button[aria-pressed=true] { background:var(--accent); color:var(--on-accent); font-weight:600; }
.seg button[disabled] { cursor:not-allowed; opacity:.6; }
select, textarea, input.f { border:1px solid var(--line); background:var(--panel); border-radius:6px; padding:4px 8px; width:100%; }
select { width:auto; }
textarea { resize:vertical; min-height:84px; }
select:focus-visible, textarea:focus-visible, input.f:focus-visible { outline:2px solid var(--accent); outline-offset:1px; }
.field { display:flex; flex-direction:column; gap:3px; margin:9px 0; font-size:13px; }
.field label { font-weight:600; }
.hint { font-size:12px; color:var(--muted); }
.err-msg { color:var(--bad); font-size:12px; min-height:16px; }
.cmdbox { border:1px solid var(--line); border-radius:7px; background:var(--panel2); margin:8px 0; overflow:hidden; }
.cmdrow { display:flex; align-items:center; gap:8px; padding:6px 8px; }
.cmdrow + .cmdrow { border-top:1px solid var(--line); }
.cmdrow .n { color:var(--muted); font-size:11px; width:14px; }
.cmdrow code { flex:1; font:12.5px ui-monospace,Consolas,monospace; overflow-wrap:anywhere; }
.cmdcap { font-size:12px; color:var(--muted); padding:6px 8px; border-top:1px solid var(--line); }
.secbody { font-size:13px; white-space:pre-wrap; overflow-wrap:anywhere; }
.qrow { display:flex; align-items:center; gap:8px; padding:4px 0; border-top:1px solid var(--line); font-size:13px; }
.qrow:first-of-type { border-top:0; }
.qrow .t { flex:1; min-width:0; overflow-wrap:anywhere; }
.mini-run { display:flex; gap:8px; align-items:baseline; font-size:12.5px; padding:3px 0; border-top:1px solid var(--line); }
.mini-run:first-of-type { border-top:0; }
.mini-run .m { color:var(--muted); font-size:12px; }

/* ---------- toasts, demo bar ---------- */
#toasts { position:fixed; left:16px; bottom:48px; display:flex; flex-direction:column; gap:6px; z-index:50; max-width:min(420px,calc(100vw - 32px)); }
.toast { background:var(--panel); border:1px solid var(--line); border-left:4px solid var(--accent); border-radius:6px; padding:7px 11px; box-shadow:var(--shadow); font-size:13px; }
.toast.warn { border-left-color:var(--warn); } .toast.bad { border-left-color:var(--bad); } .toast.good { border-left-color:var(--good); }
.demo { position:fixed; left:0; right:0; bottom:0; background:var(--panel); border-top:1px solid var(--line); padding:5px 16px; display:flex; gap:10px; align-items:center; font-size:12px; color:var(--muted); z-index:40; flex-wrap:wrap; }
.demo select { padding:1px 6px; font-size:12px; }

.scrim { display:none; }
@media (max-width:1000px) {
  .layout { grid-template-columns:1fr; }
  .panel { position:fixed; top:0; right:0; bottom:0; width:min(430px,100vw); max-height:none; border-radius:0; z-index:30; transform:translateX(104%); transition:transform .18s; box-shadow:var(--shadow); }
  .panel.open { transform:none; }
  .scrim.on { display:block; position:fixed; inset:0; background:#0006; z-index:25; }
}
@media (max-width:640px) { .search { width:100%; } .task-acts { margin-left:0; } }
</style>
</head>
<body>
<header class="top">
  <div class="top-row">
    <h1>Tasks</h1>
    <span class="proto">Prototype A -- stage map</span>
    <span class="muted" style="font-size:12px">Mock data, no backend. Click around: queue, cancel, retry, resolve.</span>
    <span class="grow"></span>
    <button class="btn" id="pauseBtn" data-action="pause" aria-pressed="false"></button>
  </div>
  <div class="top-row">
    <div class="chips" id="chips" role="group" aria-label="Project filter"></div>
    <input class="search" id="search" type="search" placeholder="Filter tasks and items" aria-label="Filter tasks and items">
    <span class="grow"></span>
    <div class="status" id="status" role="status" aria-live="polite"></div>
    <button class="btn primary" data-action="newtask"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>New task</button>
  </div>
</header>

<div class="layout">
  <main id="main" aria-label="Task pipelines"></main>
  <aside class="panel" id="panel" aria-label="Selection details"></aside>
</div>
<div class="scrim" id="scrim" data-action="closepanel"></div>
<div id="toasts" aria-live="polite"></div>
<div class="demo">
  <span>Prototype controls:</span>
  <label>Demo speed <select id="speed" aria-label="Demo speed"><option value="1">1x</option><option value="4">4x</option><option value="12">12x</option></select></label>
  <button class="btn sm" data-action="reset">Reset mock data</button>
  <span class="grow"></span>
  <span>One running job per project; projects run in parallel. Blocked work never guesses.</span>
</div>

<script>
(function () {
'use strict';

/* ================= helpers ================= */
var SVG = {

  defer: function (a) { var f = find(a.key); f.it.state = 'deferred'; touch(f.t); toast('Deferred "' + f.it.title + '".', ''); render(); },

  var q = S.ui.q;
  if (q && (t.title + ' ' + t.stub + ' ' + t.items.map(function (i) { return i.title + ' ' + i.id; }).join(' ')).toLowerCase().indexOf(q) < 0) return false;

}
function chipHtml(it) { return '<span class="chip ' + it.model + '"><i class="dot"></i>' + it.model + ' / ' + it.effort + '</span>'; }

  if (!f) return panelOverview();
  var t = f.t, it = f.it, k = S.ui.sel, p = proj(t.project), st = it.state, locked = st === 'running' || st === 'done';
  var h = '<div class="p-head"><div class="crumbs"><span>' + esc(p.name) + '</span><span>/</span><button class="task-id-copy" data-action="copy" data-text="' + esc(t.stub) + '" title="Copy task name">' + esc(t.stub) + '</button></div><span class="grow"></span><button class="btn sm" data-action="closepanel" aria-label="Close panel">' + ic('close') + '</button></div>'
    + '<h2>' + esc(it.title) + '</h2>'
    + '<div class="badges"><span class="badge" style="--c:' + ({ available:'var(--accent)', queued:'var(--queue)', running:'var(--run)', blocked:'var(--warn)', failed:'var(--bad)', deferred:'var(--muted)', done:'var(--good)' }[st]) + '">' + STATE_LABEL[st] + (st === 'queued' ? ' #' + qpos(t, it) : '') + '</span>'
    + (it.pri ? '<span class="pri ' + it.pri + '">' + it.pri + '</span>' : '') + chipHtml(it) + '<span class="chip mono">' + esc(it.id) + '</span></div>';

  /* state block */
  if (st === 'running') {
    h += '<div class="callout info"><strong class="live">Running - attempt ' + it.attempts + '</strong><div class="row" style="display:flex;gap:10px;align-items:center;margin:4px 0"><span class="elapsed" data-elapsed="' + k + '" style="font-size:18px">' + fmtDur(it.job.elapsed) + '</span><span class="muted" data-step="' + k + '">step ' + it.job.i + ' of ' + it.script.length + '</span></div>'
      + '<div class="bar"><i data-prog="' + k + '" style="width:' + pct(it) + '%"></i></div></div>'
      + '<div class="sec-title">Progress log</div><pre class="tail" data-log="' + k + '" data-n="8">' + esc(tailText(it, 8)) + '</pre>';
  } else if (st === 'queued') {
    var q = queueIn(t.project), busy = runningIn(t.project);
    h += '<div class="callout info"><strong>Queued at position ' + qpos(t, it) + ' in ' + esc(t.project) + '</strong><p>' + (S.paused ? 'The worker is paused; it starts when you resume.' : busy ? 'Starts automatically when "' + esc(busy.it.title) + '" finishes.' : 'Starting momentarily.') + '</p></div>';
  } else if (st === 'blocked') {
    var b = it.block;
    h += '<div class="callout"><strong>' + esc(b.title) + '</strong><p>' + esc(b.detail) + '</p>' + (b.ask ? '<p style="margin-top:4px"><b>To resolve:</b> ' + esc(b.ask) + '</p>' : '') + '</div>';
    if (it.log.length) h += '<div class="sec-title">Last run</div>' + logPre(it, 5);
    if (S.ui.resolve[k]) h += cmdBox(t);
  } else if (st === 'failed') {
    h += '<div class="callout bad"><strong>' + esc(it.err.title) + ' (attempt ' + it.attempts + ')</strong><p>' + esc(it.err.detail) + '</p><p class="muted" style="margin-top:4px">Failed runs never retry on their own, so no paid loop can start.</p></div>'
      + '<div class="sec-title">Log tail</div>' + logPre(it, 8);
    if (S.ui.resolve[k]) h += cmdBox(t);
  } else if (st === 'done') {
    h += '<div class="callout good"><strong>Done this session</strong><p>The item leaves the plan.md task_items block on completion; the receipt is in log.md. It stays visible here until the next page load.</p></div>';
  } else if (st === 'deferred') {
    h += '<div class="callout" style="--c:var(--muted)"><strong>Deferred</strong><p>Not eligible to run. Undefer it to make it available.</p></div>';
  } else if (!it.hasSection) {
    h += '<div class="callout"><strong>No plan.md section for this item</strong><p>Queueing will fail translation and mark the item Needs you. Add a section in Claude Code first (what to do, what counts as done).</p></div>';
  }

  /* actions */
  h += '<div class="acts">';
  if (st === 'available') h += '<button class="btn primary" data-action="queue" data-key="' + k + '" data-fk="a:queue">' + ic('play', 'fill') + 'Queue</button><button class="btn" data-action="defer" data-key="' + k + '">Defer</button>';
  if (st === 'queued') h += (qpos(t, it) > 1 ? '<button class="btn" data-action="runnext" data-key="' + k + '">Run next</button>' : '') + '<button class="btn" data-action="unqueue" data-key="' + k + '">Remove from queue</button>';
  if (st === 'running') h += '<button class="btn danger" data-action="cancel" data-key="' + k + '" data-fk="a:cancel">' + ic('stop') + 'Cancel run</button>';
  if (st === 'failed') h += '<button class="btn primary" data-action="retry" data-key="' + k + '" data-fk="a:retry">' + ic('retry') + 'Retry</button><button class="btn" data-action="resolve" data-key="' + k + '">' + ic('term') + 'Resolve in Claude Code</button><button class="btn" data-action="defer" data-key="' + k + '">Defer</button>';
  if (st === 'blocked') h += '<button class="btn warn" data-action="resolve" data-key="' + k + '" data-fk="a:resolve" aria-expanded="' + !!S.ui.resolve[k] + '">' + ic('term') + 'Resolve in Claude Code</button><button class="btn" data-action="recheck" data-key="' + k + '" title="Re-read plan.md and task state after you fixed it">' + ic('retry') + 'Re-check</button>';
  if (st === 'deferred') h += '<button class="btn primary" data-action="undefer" data-key="' + k + '">Undefer</button>';
  h += '</div>';

  /* job */
  h += '<div class="sec-title">Job</div><div class="card"><dl class="kv" style="margin:0">'
    + '<dt>Model</dt><dd><span class="seg" role="group" aria-label="Model"><button data-action="model" data-v="claude" aria-pressed="' + (it.model === 'claude') + '"' + (locked ? ' disabled' : '') + '>Claude</button><button data-action="model" data-v="codex" aria-pressed="' + (it.model === 'codex') + '"' + (locked ? ' disabled' : '') + '>Codex</button></span></dd>'
    + '<dt>Effort</dt><dd><select data-field="effort" data-fk="eff" aria-label="Effort"' + (locked ? ' disabled' : '') + '>' + EFFORTS[it.model].map(function (e) { return '<option' + (e === it.effort ? ' selected' : '') + '>' + e + '</option>'; }).join('') + '</select></dd>'
    + '<dt>Runs in</dt><dd class="mono" style="font-size:12px">' + esc(p.root) + '</dd>'
    + '<dt>Prompt</dt><dd class="mono" style="font-size:12px">plan.md &gt; ## ' + esc(it.id) + '</dd></dl>'
    + '<p class="hint" style="margin-top:6px">If the agent needs a decision or a permission it cannot get, the job stops and the item turns Needs you.</p></div>';

  /* plan section */
  h += '<div class="sec-title">plan.md section</div><div class="card"><div class="secbody">' + (it.hasSection ? esc(it.sec || 'Details live in the plan.md section for this item.') : '<span class="muted">(missing)</span>') + '</div></div>';
  h += '<div class="sec-title">Task summary</div><p style="font-size:13px">' + esc(t.summary) + '</p>';

  /* runs for this task */
  var mine = S.runs.filter(function (r) { return r.key.split('/')[0] === t.stub; }).slice(0, 4);
  h += '<div class="sec-title">Recent runs on this task</div>';
  h += mine.length ? mine.map(function (r) { return '<div class="mini-run"><span class="out ' + r.outcome + '">' + r.outcome + '</span><span style="flex:1;min-width:0;overflow-wrap:anywhere">' + esc(r.title) + '</span><span class="m">' + fmtDur(r.ms) + ' - ' + ago(r.at) + '</span></div>'; }).join('') : '<p class="muted" style="font-size:13px">No runs yet.</p>';
  return h;
}
function projOptions(sel) { return S.projects.map(function (p) { return '<option value="' + p.id + '"' + (p.id === sel ? ' selected' : '') + '>' + esc(p.name) + '</option>'; }).join(''); }
function priOptions() { return '<option>P1</option><option selected>P2</option><option>P3</option>'; }
function panelAdd() {
  var t = S.tasks.filter(function (x) { return x.stub === S.ui.addTask; })[0];
  return '<div class="p-head"><div class="crumbs"><span>' + esc(t.project) + ' / ' + esc(t.stub) + '</span></div><span class="grow"></span><button class="btn sm" data-action="cancelform" aria-label="Close">' + ic('close') + '</button></div>'
    + '<h2>Add an item</h2><p class="muted" style="font-size:13px">Define the work, then queue it. Other jobs keep running.</p>'
    + '<div class="field"><label for="f-title">Title</label><input class="f" id="f-title" autocomplete="off" placeholder="What should the agent do?"></div>'
    + '<div class="field"><label for="f-pri">Priority</label><select id="f-pri">' + priOptions() + '</select></div>'
    + '<div class="field"><label for="f-det">Details (becomes the plan.md section)</label><textarea id="f-det" placeholder="What to do, where, and what counts as done."></textarea><span class="hint">Required to run: an item without a section fails translation and shows up as Needs you.</span></div>'
    + '<div class="err-msg" id="f-err" role="alert"></div>'
    + '<div class="acts"><button class="btn primary" data-action="submitadd" data-q="1">Add and queue</button><button class="btn" data-action="submitadd" data-q="0">Add only</button><button class="btn" data-action="cancelform">Cancel</button></div>';
}
function panelNew() {
  return '<div class="p-head"><h2 style="margin:0">New task</h2><span class="grow"></span><button class="btn sm" data-action="cancelform" aria-label="Close">' + ic('close') + '</button></div>'
    + '<div class="field"><label for="f-proj">Project</label><select id="f-proj">' + projOptions(S.ui.filter !== 'all' ? S.ui.filter : 'afterplay') + '</select></div>'
    + '<div class="field"><label for="f-title">Title</label><input class="f" id="f-title" autocomplete="off" placeholder="Short name for the outcome"></div>'
    + '<div class="field"><label for="f-stub">Folder name (dev/tasks/&lt;name&gt;)</label><input class="f mono" id="f-stub" autocomplete="off" placeholder="derived from the title"></div>'
    + '<div class="field"><label for="f-pri">Priority</label><select id="f-pri">' + priOptions() + '</select></div>'
    + '<div class="field"><label for="f-item">First item</label><input class="f" id="f-item" autocomplete="off" placeholder="The first unit of work"></div>'
    + '<div class="field"><label for="f-det">Details for that item</label><textarea id="f-det" placeholder="What to do, where, and what counts as done."></textarea><span class="hint">Leave empty to add the item without a plan.md section.</span></div>'
    + '<div class="err-msg" id="f-err" role="alert"></div>'
    + '<div class="acts"><button class="btn primary" data-action="submitnew">Create task</button><button class="btn" data-action="cancelform">Cancel</button></div>';
}
function renderPanel() {
  var pn = $('panel');
  pn.innerHTML = S.ui.mode === 'item' ? panelItem() : S.ui.mode === 'add' ? panelAdd() : S.ui.mode === 'newtask' ? panelNew() : panelOverview();
  pn.classList.toggle('open', S.ui.panelOpen);
  $('scrim').classList.toggle('on', S.ui.panelOpen);
  var ti = $('f-title'); if (ti) ti.focus();
}

function render(opts) {
  var ae = document.activeElement, fk = ae && ae.getAttribute ? ae.getAttribute('data-fk') : null;
  var mode = S.ui.mode, keepForm = (mode === 'add' || mode === 'newtask') && !(opts && opts.panel);
  renderStatus(); renderChips(); renderRunning(); renderNeeds(); renderMaps(); renderRuns();
  if (!keepForm) {
    var pn = $('panel'), top = pn.scrollTop;
    renderPanel();
    if (!(opts && opts.panel)) pn.scrollTop = top;
  }
  if (fk) { var again = document.querySelector('[data-fk="' + fk.replace(/"/g, '\\"') + '"]'); if (again) again.focus({ preventScroll:true }); }
}

/* mount points inside #main */
$('main').innerHTML = '<section id="main-running"></section><section id="main-needs"></section><section id="main-maps"></section><section id="main-runs"></section>';
render({ panel:true });
setInterval(tick, 500);
})();
</script>
</body>
