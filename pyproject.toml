[project]
name = "plugins-kit"
version = "0.1.0"
requires-python = ">=3.12"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-xdist>=3.5",
    "pyyaml",
    "regex",
    "websocket-client>=1.6",
    "fastapi>=0.110",
    "httpx>=0.27",
    "markdown-it-py",
    "psutil>=6.0",
    "packaging>=24.0",
    # The consumer requirement the plugins declare, resolved from the index.
    # No path source: packages/ distributions refuse to build without a release
    # identity (packages/_build/hatch_build.py), so an editable install fails.
    "katsoft-contracts>=1.0,<2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Work-stealing distribution for every -n run: the default `load` mode pre-assigns
# contiguous chunks, so slow test blocks cluster on a few workers. Inert without -n.
addopts = ["--dist=worksteal"]
# pythonpath is reserved for genuine package roots (plus the engine dir, whose
# modules tests import as bare names). Do NOT add per-skill script dirs here:
# they share one flat namespace and risk shadowing. Single-file skill scripts
# are loaded in tests via importlib.util.spec_from_file_location instead (see
# tests/pdf-kit/test_html_pdf.py for the pattern).
pythonpath = [
    "plugins/bootstrap",
    "plugins/bootstrap/engine",
    "plugins/skills-kit",
    # Exception (grandfathered): tests/skills-kit/test_discover.py imports
    # `discover` as a bare module from this per-skill script dir.
    "plugins/skills-kit/skills/md-domain/scripts",
]
