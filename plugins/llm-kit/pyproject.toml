[project]
name = "llm-kit"
version = "0.11.0"
description = "LLM access, durable agent jobs and batch content pipelines in one library (dev-only consolidation)"
requires-python = ">=3.12"

# The plugin venv installs the released library as a consumer. Each extra names
# a capability's third-party packages; the plugin venv enables every extra its
# bundled commands reach. The floor is 1.3 because the surface the plugin
# documents (Codex in package mode, the project model file, `models catalog`,
# protocol 2, the neutral user paths) first ships in 1.3.0; custom_bootstrap.py
# also reads `llm-kit account status --json`, which first shipped in 1.2.0. bootstrap holds
# the venv at the highest released version the requirement admits
# (packages/released.json), so a requirement must keep this exact form.
dependencies = [
    "katsoft-llm-kit[config,sdk,local,frontdoor,jobs,pipeline]>=1.5,<2",
    "katsoft-contracts>=1.0,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

# llm-kit is not an importable package here: the library comes from the
# katsoft-llm-kit distribution above, and the console script `llm-kit` is that
# distribution's. Marking the project non-package stops uv from installing the
# plugin itself (and from keeping an editable llm_kit beside the wheel).
[tool.uv]
package = false
