# Machine-global defaults for content-pipeline-kit.
#
# Everything here rides on top of llm-scripting-kit's own layered config.yaml
# (model registry, API key resolution) -- this file only carries settings
# that are specific to content_pipeline itself (the content-addressed
# response cache directory, model-binding overrides). Per-project values
# (CONTENT_ROOT, VCS_BACKEND, LLM_BACKEND) live in project_config instead;
# see bootstrap.json.

cache_dir: cache
