[project]
name = "llm-scripting-kit"
version = "0.68.3"
description = "LLM access, local model launch profiles, and completion backends for Claude Code plugins"
requires-python = ">=3.12"

# katsoft-llm-kit carries llm_kit.adapters.codex_command, the module the
# bootstrap_lib.codex alias resolves to (first shipped in 1.3.0); this frozen
# plugin reaches Codex command construction only through that alias.
dependencies = ["pyyaml", "psutil>=6.0", "katsoft-contracts>=1.0,<2", "katsoft-llm-kit>=1.3,<2"]

[project.scripts]
llm-scripting-kit = "llm_scripting_kit.cli:main"

[project.optional-dependencies]
sdk = ["openai>=1.0.0"]
dev = ["pytest>=7.0"]
frontdoor = ["fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["lib"]
