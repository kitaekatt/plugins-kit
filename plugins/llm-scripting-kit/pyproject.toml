[project]
name = "llm-scripting-kit"
version = "0.4.1"
description = "LLM key resolution, model registry, named OpenAI-compatible endpoints, and a completion seam (OpenRouter + local claude-cli backends) for Claude Code plugins (importable package: openrouter_kit)"
requires-python = ">=3.10"

dependencies = ["pyyaml"]

[project.optional-dependencies]
sdk = ["openai>=1.0.0"]
dev = ["pytest>=7.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["lib"]
