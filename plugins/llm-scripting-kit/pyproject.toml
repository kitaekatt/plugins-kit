[project]
name = "llm-scripting-kit"
version = "0.32.0"
description = "LLM access, local model launch profiles, and completion backends for Claude Code plugins"
requires-python = ">=3.10"

dependencies = ["pyyaml"]

[project.scripts]
llm-scripting-kit = "llm_scripting_kit.cli:main"

[project.optional-dependencies]
sdk = ["openai>=1.0.0"]
dev = ["pytest>=7.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["lib"]
