# Model registry, selection defaults, and named endpoints (shipped baseline).
#
# This is the lowest-precedence layer. Bootstrap seeds an editable copy at
#   ~/.claude/plugins/data/plugins-kit/llm-scripting-kit/config.yaml
# and a project may override at
#   <project_root>/.local-data/plugins-kit/llm-scripting-kit/config.yaml
# Higher layers are deep-merged over this one (project wins); new model or
# endpoint entries union in, so an override file only states what it changes.
#
# Consumed by any plugin that makes LLM calls via llm_scripting_kit.resolve_model()
# / make_openai_client() (e.g. workflow-kit, content-pipeline-kit).
#
# Keep in sync with DEFAULT_MODEL_CONFIG in models.py (a test enforces this).

# Which endpoint is used when a caller passes endpoint=None.
default_endpoint: openrouter

# Named OpenAI-compatible endpoints. Each may carry base_url, key_env, an
# account_check mode ("openrouter" | "none" | "models-probe"), and its own
# models / default / defaultCheap. An endpoint that omits those inherits the
# top-level registry below -- which is why the built-in `openrouter` endpoint
# lists none: it uses the top-level models/default/defaultCheap.
#
# To add another endpoint, drop it here in a user or project override, e.g.:
#   endpoints:
#     my-vllm:
#       base_url: http://localhost:8000/v1
#       key_env: MY_VLLM_API_KEY
#       account_check: none          # or models-probe to GET /models
#       default: llama
#       models:
#         llama: {slug: meta-llama/Llama-3.1-8B-Instruct}
#
# KEYLESS endpoints: write `key_env: null` explicitly and no credential is
# resolved or sent -- the norm for a locally hosted server. OMITTING key_env is
# not the same thing and still raises, so a dropped line cannot silently turn
# auth off.
#
# key_file: an endpoint may also set `key_file: <path>` to read a credential
# that already exists as a bare-value file -- the whole file content, with
# surrounding whitespace/newline stripped, is used as the key. `~` expands to
# the home directory. This is the LOWEST-precedence layer: the key_env
# environment variable and every .env layer (project, then user) all win over
# key_file, so setting it cannot change what a machine that already resolves a
# key resolves. A missing, unreadable, or empty file silently yields no key
# from this layer -- a keyless endpoint stays a supported configuration. No
# default path is shipped here; where the file lives is the user's business.
#
# Endpoints may also come from the model-endpoints REGISTRY: entries in
# ~/.claude/config/model-endpoints.yaml (or the file MODEL_ENDPOINTS_REGISTRY
# names when set) resolve as endpoints by their entry id, without appearing
# here. An endpoint declared in this file shadows a registry entry of the same
# name. Schema and default-entry resolution: model_endpoints.py.
endpoints:
  openrouter:
    base_url: https://openrouter.ai/api/v1
    key_env: OPENROUTER_API_KEY
    account_check: openrouter

  # HARNESS entries. A harness entry carries `harness` + `model` and NO
  # base_url: it is driven by a CLI that supplies an agent loop, tools and a
  # working directory, not called over HTTP. Asking for one as an
  # OpenAI-compatible endpoint is refused by kind rather than reported as a
  # missing base_url.
  #
  # These two are shipped because they are codex SUBSCRIPTION models -- nothing
  # about them is machine-specific, so a fresh machine with codex reproduces
  # the fleet's routing from shipped defaults alone. Opencode models are
  # deliberately NOT shipped: they name providers from the user's own opencode
  # config, which this repo neither ships nor reads, so there is no default
  # that would resolve anywhere but on the machine that wrote it. Declare those
  # in the model-endpoints registry instead.
  sol:
    harness: codex
    model: gpt-5.6-sol
    effort: high
  luna:
    harness: codex
    model: gpt-5.6-luna
    effort: high

  # Claude subscription models, shipped for the same reason as the codex pair
  # above: nothing about them is machine-specific, so a fresh machine with the
  # claude CLI reproduces the fleet's routing from shipped defaults alone. The
  # claude-cli adapter existed with no endpoint pointing at it, which made
  # Claude reachable in principle and unusable in practice. Effort is a
  # per-call mapped param on this adapter, so none is set here.
  sonnet:
    harness: claude
    model: claude-sonnet-5
  opus:
    harness: claude
    model: claude-opus-5
  fable:
    harness: claude
    model: claude-fable-5

# Top-level model registry (the openrouter endpoint's registry). Named
# selection: `default` for general use, `defaultCheap` for cheap/smoke work.
# Each references a key under `models` (or may be a raw slug).
models:
  qwen:
    slug: qwen/qwen3-32b
  gpt-mini:
    slug: openai/gpt-4o-mini
  gemini-lite:
    slug: google/gemini-2.5-flash-lite

default: gpt-mini
defaultCheap: qwen
