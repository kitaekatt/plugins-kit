[project]
name = "yaml-data-editor-kit"
version = "0.17.0"
description = "Project-independent YAML data dialect: schema, anchored comments, and planner/dispatcher binding. Databench owns the browser editor boundary; this package ships no web editor."
requires-python = ">=3.10"

dependencies = ["pyyaml", "openai>=1.0.0"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["lib"]
