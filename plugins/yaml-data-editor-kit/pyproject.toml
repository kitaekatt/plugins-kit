[project]
name = "yaml-data-editor-kit"
version = "0.12.0"
description = "Project-independent YAML data dialect: schema, anchors and comments, planner/dispatcher, and a web editor surface."
requires-python = ">=3.10"

dependencies = ["pyyaml", "openai>=1.0.0"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["lib"]
