[project]
name = "workflow-kit"
version = "0.14.0"
description = "Host-side library for the workflow-kit plugin: validate + compile .workflow.yaml to native Workflow tool scripts."
requires-python = ">=3.12"

dependencies = [
    "pyyaml>=6.0",
    # llm_kit: the declaration API, transport factory and output contract the
    # openrouter node strategy calls. The sdk extra brings the openai SDK its
    # OpenRouter backend uses; the config extra brings the pyyaml its registry
    # loader imports.
    "katsoft-llm-kit[config,sdk]>=1.1,<2",
    "katsoft-contracts>=1.0,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["workflow_kit_lib*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
