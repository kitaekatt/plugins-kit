[project]
name = "job-kit"
version = "0.14.2"
description = "Durable execution for heterogeneous agent jobs through a bounded worker pool."
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0",
    # Reached transitively through llm_scripting_kit.completion, which the
    # endpoint selector imports. Declared directly for the same reason
    # content-pipeline-kit declares it: the dependency is real at import time
    # whether or not this package names the module itself.
    "openai>=1.0.0",
    "katsoft-contracts>=1.0,<2",
    # bootstrap_lib.codex is an exact alias of llm_kit.adapters.codex_command
    # (first shipped in katsoft-llm-kit 1.3.0); a codex dispatch through the
    # linked llm_scripting_kit resolves it in this venv, so the package is
    # declared here and not reached through a link.
    "katsoft-llm-kit>=1.3,<2",
]

[project.scripts]
job-kit = "job_kit.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["lib"]
