[project]
name = "git-kit"
version = "0.16.0"
description = "Host-side dependencies for git-kit plugin"
requires-python = ">=3.12,!=3.14.*"

# bootstrap_lib is provided via the bootstrap shared-libs .pth (this plugin declares
# "shared_lib_imports": ["bootstrap_lib"] in bootstrap.json), not as a pip dependency.
# PyYAML is needed because the review pipeline resolves a project's declared
# plugin-write paths through bootstrap_lib.config_resolve, which reads the
# project's config layer to honour a plugin_data_dir relocation.
# openai is needed because a review lane may be routed to a configured
# llm-scripting-kit endpoint (a non-Agent `model` in a review profile), and the
# transport backend imports the SDK lazily. llm_scripting_kit itself arrives via
# the shared-libs .pth, declared in bootstrap.json -- the SDK is the one piece it
# does not bring with it.
dependencies = ["pyyaml", "openai"]
