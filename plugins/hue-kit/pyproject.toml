[project]
name = "hue-kit"
version = "0.6.0"
description = "Host-side dependencies for the hue-kit plugin (Philips Hue layered scene framework)."
requires-python = ">=3.10"

# No [build-system]: this project ships no package, only host-side deps.
# Bootstrap runs `uv sync`, which installs these into the plugin venv; omitting
# the build backend makes uv skip building/installing an empty hue-kit wheel
# (matches the deps-only convention in git-kit / p4-kit).
dependencies = [
  "requests",
  "pyyaml",
  "urllib3",
  "zeroconf",  # local mDNS bridge discovery (fallback when the cloud service is down / rate-limited)
]
