# Layered scene designs -- source of truth for the layered Hue sync.
# Generated by `scene-layers.py --export-designs` from the live bridge
# colours + the scene-groups.yaml registry; edit here, then apply.
#
# Each scene = default OFF + an ordered LAYER stack (bottom -> top); the
# topmost layer covering a light wins, so a lower layer's group may be a
# superset that higher layers overpaint. Each layer paints one registry
# group. xy is AUTHORITATIVE (exact Hue gamut); the trailing # hsl(...)
# is a readable annotation only. ct: <mirek> = tunable white. bri = %.
# Vocabulary (6 groups): ALL, PRIMARY, SECONDARY, MOOD, KITCHEN, BATHROOM -- defined in scene-groups.yaml.
scenes:
  - name: Arcade
    layers:   # bottom -> top
      - { group: ALL,     xy: [0.1700, 0.7000], bri: 100 }  # hsl(135, 100%, 50%)
      - { group: PRIMARY, xy: [0.6915, 0.3083], bri: 100 }  # hsl(9, 100%, 50%)
      - { group: MOOD,    xy: [0.1532, 0.0475], bri: 100 }  # hsl(253, 100%, 50%)

  - name: Chill
    layers:   # bottom -> top
      - { group: ALL, xy: [0.5939, 0.3648], bri: 28 }       # hsl(23, 100%, 60%)

  - name: Cooking
    layers:   # bottom -> top
      - { group: MOOD,    xy: [0.5282, 0.3838], bri: 70 }   # hsl(27, 100%, 67%)
      - { group: KITCHEN, xy: [0.3366, 0.3542], bri: 100 }  # hsl(65, 100%, 95%)

  - name: Dining
    layers:   # bottom -> top
      - { group: MOOD,      xy: [0.6295, 0.3549], bri: 100 }  # hsl(23, 100%, 53%)
      - { group: SECONDARY, xy: [0.5282, 0.3838], bri: 70 }  # hsl(27, 100%, 67%)

  - name: Focus
    layers:   # bottom -> top
      - { group: ALL, ct: 233, bri: 100 }                   # hsl(27, 100%, 85%)

  - name: Night
    layers:   # bottom -> top
      - { group: BATHROOM, xy: [0.6915, 0.3083], bri: 1 }   # hsl(9, 100%, 50%)
      - { group: MOOD,     xy: [0.6915, 0.3083], bri: 5 }   # hsl(9, 100%, 50%)

  - name: Party
    layers:   # bottom -> top
      - { group: ALL,     xy: [0.2261, 0.3339], bri: 100 }  # hsl(181, 100%, 81%)
      - { group: PRIMARY, xy: [0.4133, 0.1759], bri: 100 }  # hsl(307, 100%, 59%)
      - { group: MOOD,    xy: [0.1532, 0.0486], bri: 100 }  # hsl(253, 100%, 51%)

  - name: Read
    layers:   # bottom -> top
      - { group: ALL, ct: 346, bri: 100 }                   # hsl(28, 100%, 70%)

  - name: Relax
    layers:   # bottom -> top
      - { group: ALL, ct: 447, bri: 56 }                    # hsl(30, 100%, 59%)

  - name: Rest
    layers:   # bottom -> top
      - { group: ALL, xy: [0.5610, 0.4042], bri: 35 }       # hsl(34, 100%, 57%)

  - name: The Sun
    layers:   # bottom -> top
      - { group: ALL, xy: [0.3170, 0.3180], bri: 100 }      # hsl(247, 100%, 98%)

  - name: Theater
    layers:   # bottom -> top
      - { group: MOOD,     xy: [0.6915, 0.3083], bri: 5 }   # hsl(9, 100%, 50%)
      - { group: BATHROOM, xy: [0.4509, 0.3084], bri: 71 }  # hsl(354, 100%, 81%)
