[project]
name = "awesome-kit"
version = "0.79.1"
description = "Runtime dependencies for awesome-kit skills, including YAML support."
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0",
    # llm_kit: the model registry, describe/seats discovery and harness adapters
    # the orchestrate renderer reads, and llm_kit.adapters.codex_command, the
    # Codex command builder dispatch.py imports (first shipped in 1.3.0), and
    # the optional consent layer (`llm_kit.registry.consent`, describe's
    # `consent_policy`/`discovery`/`harness_auth`) whose scope `orchestrate`
    # the renderer applies (first shipped in 1.4.0). The config extra brings
    # the pyyaml its registry loader imports.
    "katsoft-llm-kit[config]>=1.4,<2",
    "katsoft-contracts>=1.0,<2",
]

# awesome-kit is not an importable package -- this pyproject exists only to
# declare the runtime venv that `uv sync --project` provisions for the plugin's
# skills. Marking it non-package stops uv from trying to build/install awesome-kit
# itself (there is no package directory to build).
[tool.uv]
package = false
