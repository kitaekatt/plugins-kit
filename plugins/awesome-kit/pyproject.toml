[project]
name = "awesome-kit"
version = "0.77.0"
description = "Runtime dependencies for awesome-kit skills, including YAML support."
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0",
    # llm_kit: the model registry, describe/seats discovery and harness adapters
    # the orchestrate renderer and dispatch.py read. The config extra brings the
    # pyyaml its registry loader imports.
    "katsoft-llm-kit[config]>=1.1,<2",
    "katsoft-contracts>=1.0,<2",
]

# awesome-kit is not an importable package -- this pyproject exists only to
# declare the runtime venv that `uv sync --project` provisions for the plugin's
# skills. Marking it non-package stops uv from trying to build/install awesome-kit
# itself (there is no package directory to build).
[tool.uv]
package = false
