interface:
  display_name: "Are We Done?"
  short_description: "Audit the whole session and close authorized work before reporting"
  default_prompt: "First choose the mode. Active mode: if the only thing left is owned running work I already launched (a background job, delegated agent, workflow, or session cron) and no other work is actionable this turn, state in one line what is running, make the last line 'Waiting on <what is running>', and skip the audit and buckets. Ending a turn is not waiting on myself: with nothing owned running, use finished mode and end with 'All done' when the verdict is Done. Finished mode: review the entire session and close outstanding work covered by my request and the authorizations visible in this session before reporting whether the work this agent owned is complete. Completion is the stopping rule; a check is not a boundary and an incidental problem is not scope; investigate implementation uncertainty rather than requesting another go. Report verified past-tense outcomes under 'Cleanup I took care of'. Use 'Remaining work' or 'Gotchas' only for owned requirements with a specific unresolved decision, access, evidence, or external dependency; name the blocker and the action it enables. Report only what my last message did not already say; when nothing is new, give the verdict line alone. Omit empty buckets. Keep ephemeral findings out of the work order and report their count on one line only when nonzero; scratch directories and their contents are not work and do not count."
