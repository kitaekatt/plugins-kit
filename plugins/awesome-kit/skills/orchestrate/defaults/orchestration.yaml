# orchestrate -- shipped orchestration policy.
#
# This file is the DEFAULT layer. Do not edit it in place: it lives inside the
# plugin and is replaced on every version update. Override it instead, in
# either or both of:
#
#   user:    ~/.claude/plugins/data/plugins-kit/awesome-kit/orchestration.yaml
#   project: <project_root>/.claude/orchestration.yaml
#
# Later layers win. Override files are SPARSE -- write only the keys you are
# changing, and everything else keeps tracking these defaults (including keys
# added by future plugin versions). Merge rules:
#
#   - mappings deep-merge, key by key
#   - lists of records (lexicon, backends, ...) merge BY `id`;
#     a record with a known id patches that record, a record with a new id is
#     appended
#   - `disabled: true` on any record removes it from the guidance
#   - scalars and plain lists replace outright
#
# Render the resolved result with:
#   python <plugin>/skills/orchestrate/scripts/orchestration_guidance.py
# and inspect the layering with `--explain`.
#
# ===========================================================================
# TWO HALVES.
#
# The DECISION half (resolution, lexicon, shape, routing, agent_types, effort,
# announce) is hand-written configuration. `routing` is the ordered policy;
# names with the `agent:` prefix use the Agent tool's fixed menu, and every
# other name resolves against llm-scripting-kit.
#
# The MACHINE half (backends, capacity) is not derived -- it is what this
# machine has and how to drive it.
# ===========================================================================

schema_version: 3

# ---------------------------------------------------------------------------
# Resolution semantics
# ---------------------------------------------------------------------------
resolution: >-
  Ordered elimination: within a block, tests are evaluated in the order given and the FIRST
  match is the answer. There is no comparison step and no tie-break.

# ---------------------------------------------------------------------------
# Lexicon
# ---------------------------------------------------------------------------
lexicon:
- id: known
  kind: skill
  render: glossed
  test: Can you write what `done` looks like without doing the work?
  gloss: you can describe what done looks like without doing it
- id: open
  kind: skill
  render: glossed
  test: Would specifying it require already having the answer?
  gloss: specifying it would require already having the answer
- id: sufficient
  kind: skill
  render: glossed
  test: Is there any ambiguity about what `done` looks like?
  gloss: the one-sentence statement is already unambiguous
- id: underspecified
  kind: skill
  render: bare
  test: The negation of `sufficient`.
- id: mechanical
  kind: concept
  test: Can you verify the result without reading surrounding context?
- id: condensation
  kind: skill
  render: glossed
  test: Does a correct answer restate what the material already says?
  gloss: the answer is already in the source
- id: inference
  kind: skill
  render: glossed
  test: Must the agent assert something no source states?
  gloss: must assert something no source states
- id: novel
  kind: skill
  render: glossed
  test: Can you name the pattern it follows? If yes, it is not novel.
  gloss: you cannot name a pattern it follows
- id: load-bearing
  kind: skill
  render: glossed
  test: Would a wrong answer propagate, or would the next step catch it?
  gloss: a wrong answer would propagate rather than be caught
- id: unverifiable
  kind: skill
  render: glossed
  test: >-
    Is there a cheap check -- a diff, a test run, a file you would read anyway -- that would
    catch the error that MATTERS here? A check catching only shallow errors does not verify.
  gloss: >-
    no cheap check would catch the error that matters -- a check catching only shallow errors
    does not verify
- id: default
  kind: skill
  render: bare
  test: Did any routing row above match? If none did, this is the term.
- id: stretch
  kind: concept
  test: Can you say what it would get wrong?
- id: plan-checkpoint
  kind: skill
  render: glossed
  test: Will other units be briefed from this output before anything re-derives it?
  gloss: a plan later units will execute against
- id: authored-here
  kind: skill
  render: glossed
  test: >-
    Is the thing being reviewed something this context drafted itself, rather than the output
    of a delegated unit?
  gloss: the orchestrator drafted the artifact under review
- id: conversational
  kind: skill
  render: glossed
  test: Is the output a deliverable you act on, or a thread you continue?
  gloss: a thread you continue, not a deliverable you act on
- id: abortable
  kind: skill
  render: bare
  test: Is there a plausible reason to kill it before it finishes?
- id: fan-out
  kind: skill
  render: glossed
  test: Does it survive collapsing into one shell command? If not, it is one unit.
  gloss: N similar units that resist collapsing into one command
- id: parallel-leaf
  kind: skill
  render: glossed
  test: Did this implementation unit pass every test in the parallel-development razor?
  gloss: an independently executable implementation leaf admitted by the parallel-development razor
- id: bulk-output
  kind: skill
  render: glossed
  test: Would you skim and discard most of the output?
  gloss: emits much more than you need to keep
- id: cross-check
  kind: skill
  render: glossed
  test: >-
    Does a conclusion already exist, and is the point to have it challenged by a different
    failure mode?
  gloss: a second opinion on a conclusion Claude already reached
- id: schema
  kind: skill
  render: bare
  test: Will you parse the result rather than read it?
# These terms support cheap, slow, or unconfined lanes. `rule-applying` and
# `mutating` participate in the shipped parallel-leaf rows; `latency-tolerant`
# remains available for user routing. A routing row may only name live
# `kind: skill` terms, and a user layer's `routing` list replaces this one in
# full, so the vocabulary must exist before an override can use it.
- id: rule-applying
  kind: skill
  render: glossed
  test: Does it apply a stated rule, rather than decide which rule applies?
  gloss: applies a stated rule rather than deciding which rule applies
- id: latency-tolerant
  kind: skill
  render: glossed
  test: >-
    Would anything -- a downstream unit, or the user reading the answer -- start sooner if
    this unit finished sooner?
  gloss: nothing starts sooner if it finishes sooner
# Scoped to effects a checkout cannot undo, NOT to "writes files". Implementation
# is write-work, so a writes-anything term would divert every implementation unit
# away from a cheap lane. Note what this term does NOT buy: a delegated unit
# cannot put a question to the user and wait for an answer -- it can only end
# with the work not done and a question in its report, which the orchestrator
# relays. So no routing row can arrange for an irreversible action to be
# confirmed first. This term marks such a dispatch; it does not gate one.
- id: mutating
  kind: skill
  render: glossed
  test: >-
    Would any effect of this unit survive a git checkout -- a push, a deploy, a service
    call, state outside the tree?
  gloss: takes effects no sandbox confines and no checkout reverts

# ---------------------------------------------------------------------------
# Shape the unit
# ---------------------------------------------------------------------------
shape:
  title: Shape the unit
  intro: Two independent axes.
  tests:
  - id: brief-shape
    principle: P0.1
    text: >-
      Shape -- {known} takes a SPECIFICATION brief; {open} takes a QUESTION brief. That is
      the only thing shape determines.
  - id: brief-sufficiency
    principle: P0.1
    text: >-
      Sufficiency -- {sufficient} dispatches as stated; otherwise the unit is {underspecified}
      and you author the brief first. All four combinations occur.
  - id: sufficiency-is-not-a-route-test
    principle: P0.2
    guard: true
    text: >-
      {sufficient} is never a routing criterion. It decides whether you author a brief, and nothing
      else -- no test below may reference it.
  - id: specify-by-volume
    principle: P0.3
    render_scope: principles-only
    text: >-
      For {known} work that is not {sufficient}: many units -- author the specification once,
      then execute across them; one unit -- skip it.
  - id: who-authors-the-specification
    principle: P0.4
    render_scope: principles-only
    text: >-
      Does writing the specification require reading material you do not already have in context?
      Yes -- a sub-agent writes it. No -- write it inline.
  - id: fan-out-collapse
    principle: P0.5
    text: >-
      Decide {fan-out} before dispatching. One that collapses into a single shell command
      is ONE unit, and work a one-liner does rarely needs delegating at all.
    without_backend:
      codex: A genuine fan-out then has no other route -- sequence the units or handle them
        inline.
  - id: parallel-development-razor
    principle: P0.9
    text: >-
      Split implementation only when EVERY candidate leaf passes all four tests: (a) its
      interface is fixed before launch, not decided inside it; (b) it has exclusive file
      ownership stated in the brief, plus backend isolation when writers share a checkout;
      (c) its standalone brief states what `done`
      looks like without requiring discovery inside the leaf; and (d) it runs a named cheap
      objective check itself. At least two leaves must be runnable now on the same dependency
      frontier. One runnable leaf at a time is sequencing, not parallelism. Cut along existing
      module and test seams. Mark each admitted unit {parallel-leaf}. A weak or cheap implementor
      takes only a {known} {rule-applying} leaf that is neither {unverifiable} nor {mutating};
      interface design, cross-cutting decisions, integration, and conflict resolution stay with
      the orchestrator or the strongest available model.
  - id: plan-is-a-unit
    principle: P0.6
    text: >-
      Route the plan itself through this tree as its own unit -- a {plan-checkpoint} -- before
      briefing anything from it. Planhood decides no shape: a settled checklist is {known},
      an architecture decision is {open}. Treat an {open} {plan-checkpoint} as {load-bearing}
      unless you can NAME the downstream check that would catch a wrong shared decision. Do
      not launch units briefed from a plan still in flight; a materially revised plan repeats
      this checkpoint; routing the plan is never itself a unit.
  - id: plan-create-or-review
    principle: P0.7
    text: >-
      For a {plan-checkpoint} that reaches the highest-cost route: can a standalone brief
      carry or reference every decision-relevant constraint without encoding the answer and
      without losing context that exists only in this conversation? Yes -- delegate plan CREATION
      (question brief). No -- author the draft and delegate plan REVIEW of it. A model that
      created a plan is not an independent reviewer of it.
  - id: plan-review-second-family
    principle: P0.8
    text: >-
      A highest-cost {plan-checkpoint} review defaults to TWO units when unwinding the decision
      later would be expensive AND a disagreement would change the plan before anything executes:
      the primary review, routed as usual, plus a {cross-check} child carrying the same brief,
      routed by the ordered rows. Skipping the child needs a named reason -- cheap to unwind,
      or nobody would act on a disagreement. If the highest-cost model is unavailable the
      primary falls through and the child still dispatches. Announce each separately.
    without_backend:
      codex: >-
        With a single model family there is no second-family child -- dispatch the primary
        review alone.
  - id: review-independence
    principle: P0.7
    text: >-
      Authorship independence holds at every route, not only the highest-cost route: a review of a
      {load-bearing} {authored-here} artifact is never dispatched to the authoring model -- the
      routing policy carries it as a condition. A delegated unit's output is never {authored-here}.
      When the orchestrator is itself the highest-cost model, the review seat is the {cross-check} child on its own conditions;
      with no second family, dispatch the review anyway and announce it as non-independent.

# ---------------------------------------------------------------------------
# Routing
# ---------------------------------------------------------------------------
routing:
- shape: [cross-check]
  models: [sol]
- shape: [novel, load-bearing]
  models: [agent:fable, sol]
  gate: >-
    write "qualifies on <criteria>; <why the broader route is the wrong seat>". If it cannot be
    written, the unit does not qualify.
  guards:
  - fable draws from a different usage pool; a pool does not degrade gracefully when spent, it stops.
  - Never choose a cheaper model for a unit that meets the fable bar to harvest the discount.
- shape: [parallel-leaf, unverifiable]
  models: [agent:sonnet]
- shape: [parallel-leaf, mutating]
  models: [agent:sonnet]
- shape: [parallel-leaf, known, rule-applying]
  models: [luna]
  guards:
  - This row routes one admitted leaf, never the whole batch. Dispatch every runnable leaf on
    the current frontier separately at low or medium effort.
- shape: [fan-out]
  models: [luna]
- shape: []
  models: [agent:sonnet]

# ---------------------------------------------------------------------------
# Agent type
# ---------------------------------------------------------------------------
agent_types:
  title: Agent type
  intro: Claude-side only.
  items:
  - id: explore
    name: Explore
    text: >-
      the default for every {open} + {condensation} unit. Read-only, not command-free -- it
      may run commands that do not change state. Give it a breadth argument, "medium" or "very
      thorough"; default "medium".
  - id: plan
    name: Plan
    text: implementation-strategy design.
  - id: general-purpose
    name: general-purpose
    text: >-
      everything else, including anything that must run commands that CHANGE state. Read-only
      inspection does not disqualify Explore.

# ---------------------------------------------------------------------------
# Effort
# ---------------------------------------------------------------------------
effort:
  title: Effort
  intro: >-
    Decided separately, after routing. Scale, low to high: `low`, `medium`, `high`, `xhigh`,
    `max`.
  backend_notes:
  - id: codex-dial
    backend: codex
    requires_model: [luna, sol]
    text: >-
      Codex-side, effort is a real dial set per dispatch -- model-entry defaults are above. A
      {parallel-leaf} + {known} + {rule-applying} unit uses `low` or `medium`: its fixed interface and cheap
      check are the quality controls, and max-effort leaves erase the wall-clock gain. luna
      otherwise carries the higher default because units arrive there for dispatch shape, not difficulty.
      Raise sol from `high` to `max` when the unit is `unverifiable`; a `cross-check`
      stays at `high`.
  note: >-
    Claude-side, effort is NOT dialable per call: the Agent tool has no effort parameter,
    agents inherit from their type or the session, and it is settable per call only through
    Workflow's `agent()` `opts.effort`. So a Claude-side effort decision is an input to routing,
    not a knob to turn afterwards. Where it IS settable on fable, set `max` -- work that reaches
    that model is dangerous in more than one way, and deliberation is the
    main quality control left.
  up_effort_note: >-
    Try higher effort before a higher-cost model -- opus at `xhigh` before reaching for fable at all -- WHERE
    effort is dialable (a CLI backend's effort setting, Workflow `agent()`). Via the Agent
    tool there is no per-call effort control for an Agent-tool opus dispatch: it inherits the session's effort
    and does not count as the higher-effort attempt. That move is
    for units that do NOT meet fable's bar; a unit already meeting it goes there directly.
  raise_when:
  - ambiguous, or several plausible approaches where picking wrong is expensive
  - you cannot verify the result cheaply
  - rework propagates rather than being caught by the next step
  lower_when:
  - it applies a stated rule rather than deciding which rule applies
  - the result is cheaply checkable
  - retry beats deliberation

# ---------------------------------------------------------------------------
# Announce every dispatch, in one line
# ---------------------------------------------------------------------------
announce:
  title: Announce every dispatch, in one line
  form: delegating <what> to <target> (<the matched row's shape terms>)
  rule: >-
    Terms only, no free prose. Use the matched routing row's shape terms; an empty shape uses
    `default`. A fallback model appends `; fell through from <id>` inside the parenthetical.
  examples:
  - id: ex-default
    requires_model: sonnet
    text: delegating rename across 30 files to sonnet (default)
  - id: ex-cross-check
    requires_model: sol
    text: delegating plan cross-check to codex/sol (cross-check)
  - id: ex-review
    requires_model: fable
    text: delegating architecture review to fable (novel, load-bearing)
  - id: ex-migration
    requires_model: luna
    text: delegating per-file API migration to codex/luna (fan-out)
  - id: ex-fallback
    requires_model: sol
    text: delegating architecture review fallback to codex/sol (novel, load-bearing; fell through from fable)

# ===========================================================================
# MACHINE HALF -- not derived from the principles. What this machine has and
# how to drive it.
# ===========================================================================

# ---------------------------------------------------------------------------
# Backends -- where a delegated unit actually runs.
#
# `detect` decides whether a backend appears in the rendered guidance:
#   {always: true}          always available
#   {command: [...]}        available if the command exits 0
#   {path: "..."}           available if the path exists (~ expanded)
# ---------------------------------------------------------------------------
backends:
  - id: agent
    name: Claude Agent tool
    detect:
      always: true
    capabilities:
      isolation: 'built in -- pass isolation: "worktree"'
      effort: Only dialable via Workflow's `agent()` `opts.effort`; else inherited.
      network: "yes"
      returns: >-
        Delivered into the orchestrating context, not fetched; no per-call
        schema -- ask for a tight structure in the brief.
    dispatch: >-
      Mechanics (report visibility, SendMessage follow-up, parallel launch)
      are in the harness prompt -- use directly; launch independent units in
      ONE message to run concurrently.
    gotchas:
      - The agent's final report is not shown to the user -- relay what matters yourself.
      - >-
        N agents each pay their own cold-start orientation and cache lineage
        that one session over the same set pays once -- worse with wider
        fan-out and more shared context.

  - id: codex
    name: Codex CLI
    detect:
      command: [codex, --version]
    capabilities:
      isolation: >-
        WRITES only, and only while every flag below is present. READS are
        unrestricted -- a unit can read any file the user can, on any drive,
        outside `-C`. Give each parallel writer its own worktree via an
        absolute `-C`; read-only units may share a tree.
      effort: >-
        Model via `-m`, fully qualified. Effort via `-c
        model_reasoning_effort=<low|medium|high|xhigh|max>` -- a config key, not
        a flag, so `--help` does not list it. `xhigh` IS accepted and is
        deliberately included: it appears in no codex help output, and this
        entry omitted it until a live run on codex-cli 0.149.1 echoed
        `reasoning effort: xhigh` back in its session header. Do not trim it out
        again on the grounds that the CLI does not document it.
      network: >-
        Only with `-c sandbox_workspace_write.network_access=true`. Without
        it egress fails SILENTLY -- `curl` returns HTTP 000, exit 1, no error
        text.
      returns: >-
        Content per the brief; `--output-schema <FILE>` can force a JSON
        Schema.
    command: >-
      codex exec -s workspace-write -c 'windows.sandbox="unelevated"'
      -c 'sandbox_workspace_write.network_access=true' -C <ABSOLUTE root>
      --add-dir <ABSOLUTE session scratchpad> --skip-git-repo-check
      --color never -o <ABSOLUTE result file> -
    dispatch: |
      `codex exec`, NEVER bare `codex` -- the TUI needs a TTY and dies
      backgrounded. Brief via stdin (`-`) from a file, never a shell
      argument. Send the command above as written: every element is there
      because a probe showed its absence fails silently.

      Every path in it must be ABSOLUTE. A relative `-C` combined with
      `--add-dir` voids the ENTIRE writable set -- writes inside the root
      fail too.

      Launch backgrounded, tail the log ONCE, and judge the run by the `-o`
      file only.

      Flag catalog, and the `-s danger-full-access` escape hatch:
      references/codex-dispatch.md.
    gotchas:
      - >-
        There is no approval channel: `codex exec` rejects `-a`, so a
        sandbox-forbidden action is AUTO-DENIED, never escalated. The turn
        then completes with exit 0 and a plausible-sounding failure
        narrative, so `$?` means nothing -- read the `-o` file.
      - >-
        On Windows, `-s workspace-write` silently degrades to read-only
        unless `-c 'windows.sandbox="unelevated"'` is passed on the command
        line. Do not rely on the user's `~/.codex/config.toml`.
      - >-
        The session scratchpad under `%TEMP%` is not writable under
        workspace-write; grant exactly it with an absolute `--add-dir`.
      - >-
        On Windows, `curl.exe` HTTPS fails in the sandbox
        (`SEC_E_NO_CREDENTIALS`) even with network open -- a TLS-stack issue,
        not a blocked network. Use an OpenSSL-based client instead.
      - >-
        `--enable multi_agent_v2` is inert unless the brief asks for
        delegation. N=8 trivial read/write items on codex-cli 0.146.0: 65s vs
        48s without it (token accounting inconclusive) -- it trades cheap
        shell reads for model round trips, losing single-context cache reuse;
        long-running independent items amortize that.
      - >-
        A `cd` in a backgrounded Bash call does not persist -- always pass an
        absolute `-C`.

# ---------------------------------------------------------------------------
# Capacity -- best-effort awareness of remaining usage.
#
# Claude Code does NOT expose per-model usage. What is observable is the
# overall 5-hour and 7-day rate-limit windows (the statusline hook payload);
# claude-ui-kit snapshots those to `snapshot_path` if it is installed. So a
# model-specific usage cannot be derived from these account-wide windows; use
# the routing rows and detected model roster rather than inventing a value.
#
#   source: auto     read snapshot_path when it exists (default)
#           none     no capacity reporting
#           command  run `command` and parse its stdout as the snapshot JSON
# ---------------------------------------------------------------------------
capacity:
  source: auto
  snapshot_path: ~/.claude/plugins/data/plugins-kit/claude-ui-kit/rate-limits.json
  command: null
  # Older than this and the snapshot is reported as stale rather than trusted.
  max_age_minutes: 30
  thresholds:
    warn_remaining_pct: 25
    critical_remaining_pct: 10
