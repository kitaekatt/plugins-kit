[project]
name = "task-kit"
version = "0.12.0"
description = "Runtime dependencies for the task-kit task skill and dashboard, including YAML support."
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0",
    "openai>=1.0.0",
    "psutil>=6",
]

# task-kit is not an importable package -- this pyproject exists only to
# declare the runtime venv that `uv sync --project` provisions for the plugin's
# skill. Marking it non-package stops uv from trying to build/install task-kit
# itself (there is no package directory to build).
[tool.uv]
package = false
