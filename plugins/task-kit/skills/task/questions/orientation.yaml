_schema_version: "1"
id: orientation
version: 1
title: Orientation
applies_to: [active, blocked, deferred, closed]
inputs: [task, claude_md, plan_md, items, activity]
max_input_chars: 40000
script: null
prompt: |
  From the task files below, answer for someone opening this task: what it is,
  where it stands, and the single next action. Return one JSON object with
  exactly the keys headline, state and next. Each value is one line of plain
  ASCII text. headline names the task's purpose in at most 100 characters.
  state says where the work stands in at most 200 characters. next is the one
  action to take first, in at most 160 characters. Use only what the files say.
answer:
  type: object
  required: [headline, state, next]
  additionalProperties: false
  properties:
    headline: {type: string, minLength: 1, maxLength: 100}
    state: {type: string, minLength: 1, maxLength: 200}
    next: {type: string, minLength: 1, maxLength: 160}
grounding: []
models: null
effort: null
